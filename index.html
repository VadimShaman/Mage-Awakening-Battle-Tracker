<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mage: The Awakening — Battle Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dark-bg">

    <div class="container">
        <header>
            <h1>🧙 Mage: The Awakening</h1>
            <p class="subtitle">Боевой трекер для Хроник Тьмы · 2-е издание</p>
        </header>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="openTab(event, 'tracker-tab')">⚔️ Трекер боя</button>
            <button class="tab-btn" onclick="openTab(event, 'spell-tab')">🔮 Заклинания</button>
            <button class="tab-btn" onclick="openTab(event, 'guide-tab')">📜 Гайд</button>
        </div>

        <!-- ВКЛАДКА: ТРЕКЕР -->
        <div id="tracker-tab" class="tab-content active">
            <h2>Активные сражения</h2>
            <div class="battle-setup">
                <input type="text" id="battle-name-input" placeholder="Название боя (например, «Осада Атенеума»)">
                <button id="btn-create-battle" class="btn-primary">➕ Создать бой</button>
            </div>
            <div id="active-battles-list"></div>
        </div>

        <!-- ВКЛАДКА: ЗАКЛИНАНИЯ -->
        <div id="spell-tab" class="tab-content">
            <h2>Калькулятор заклинаний</h2>
            <p style="color: var(--text-dim); margin-bottom: 16px;">
                Полноценный калькулятор Охватов, Маны и Парадокса.
            </p>
            <a href="spell-helper.html" class="btn-primary" style="text-decoration:none; display:inline-block;">
                🔮 Открыть калькулятор
            </a>
        </div>

        <!-- ВКЛАДКА: ГАЙД -->
        <div id="guide-tab" class="tab-content">
            <h2>Гайд по механике</h2>
            <p style="color: var(--text-dim);">
                Справочник по Хроникам Тьмы будет добавлен позже.
            </p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script>
        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>

</html>
