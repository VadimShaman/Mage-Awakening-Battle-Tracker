<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочник — Mage: The Awakening 2e</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ============================================================
           СПРАВОЧНИК — СПЕЦИФИЧНЫЕ СТИЛИ
           ============================================================ */
        .guide-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
            margin-top: 20px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .guide-layout {
                grid-template-columns: 1fr;
            }
        }

        /* ==== БОКОВАЯ НАВИГАЦИЯ ==== */
        .guide-sidebar {
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
        }

        @media (max-width: 900px) {
            .guide-sidebar {
                position: static;
                max-height: none;
            }
        }

        .guide-nav-group {
            margin-bottom: 12px;
        }

        .guide-nav-group-title {
            font-size: 0.75em;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 8px;
            margin-bottom: 4px;
        }

        .guide-nav-item {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 0.9em;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .guide-nav-item:hover {
            background: rgba(106, 122, 255, 0.1);
            color: var(--accent-glow);
        }

        .guide-nav-item.active {
            background: var(--primary-blue);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 12px rgba(106, 122, 255, 0.4);
        }

        /* ==== КОНТЕНТ ==== */
        .guide-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            min-height: 400px;
        }

        @media (max-width: 640px) {
            .guide-content {
                padding: 16px;
            }
        }

        .guide-panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .guide-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guide-panel h1 {
            font-size: 1.6em;
            color: var(--accent-glow);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .guide-panel h2 {
            font-size: 1.2em;
            color: var(--accent-cyan);
            margin: 20px 0 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .guide-panel h3 {
            font-size: 1em;
            color: var(--text-light);
            margin: 14px 0 8px;
        }

        .guide-panel p {
            margin-bottom: 10px;
            line-height: 1.6;
            color: var(--text-light);
        }

        .guide-panel ul,
        .guide-panel ol {
            margin: 8px 0 12px 20px;
            line-height: 1.7;
        }

        .guide-panel li {
            margin-bottom: 4px;
        }

        .guide-panel strong {
            color: #fff;
            font-weight: 600;
        }

        .guide-panel em {
            color: var(--text-dim);
            font-style: italic;
        }

        .guide-panel code {
            background: var(--bg-dark);
            color: #eb459e;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.9em;
        }

        .guide-panel blockquote {
            border-left: 3px solid var(--accent-glow);
            background: rgba(106, 122, 255, 0.06);
            padding: 10px 16px;
            margin: 12px 0;
            border-radius: 0 6px 6px 0;
            color: var(--text-light);
            font-style: italic;
        }

        .guide-panel table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 0.9em;
        }

        .guide-panel th,
        .guide-panel td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            text-align: left;
        }

        .guide-panel th {
            background: var(--bg-dark);
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .guide-panel tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .guide-panel hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }

        /* ==== ПОИСК ==== */
        .guide-search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .guide-search-bar input {
            flex: 1;
        }

        /* ==== ПОДСВЕТКА ПОИСКА ==== */
        .guide-search-mark {
            background: rgba(250, 166, 26, 0.4);
            border-radius: 2px;
            padding: 0 2px;
        }

        /* ==== БЕЙДЖ-ТЕГ ==== */
        .guide-tag {
            display: inline-block;
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(106, 122, 255, 0.15);
            color: var(--accent-glow);
            border: 1px solid rgba(106, 122, 255, 0.3);
            margin-left: 6px;
            font-weight: 600;
            vertical-align: middle;
        }

        .guide-tag.cyan {
            background: rgba(90, 200, 216, 0.15);
            color: var(--accent-cyan);
            border-color: rgba(90, 200, 216, 0.3);
        }

        .guide-tag.purple {
            background: rgba(138, 90, 170, 0.15);
            color: var(--accent-purple);
            border-color: rgba(138, 90, 170, 0.3);
        }

        .guide-tag.warn {
            background: rgba(204, 68, 68, 0.15);
            color: var(--danger);
            border-color: rgba(204, 68, 68, 0.3);
        }
    </style>
</head>

<body class="dark-bg">

    <div class="container">
        <header style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>📖 Справочник</h1>
                <p class="subtitle">Mage: The Awakening 2e — быстрые правила и шпаргалки</p>
            </div>
            <a href="index.html" class="tab-btn" style="text-decoration:none;">🏠 На главную</a>
        </header>

        <div class="guide-search-bar">
            <input type="text" id="guide-search" placeholder="🔍 Поиск по справочнику...">
            <button class="tab-btn" id="guide-search-clear" style="display:none;">✖️</button>
        </div>

        <div class="guide-layout">
            <!-- ==== БОКОВАЯ НАВИГАЦИЯ ==== -->
            <aside class="guide-sidebar" id="guide-sidebar">
                <!-- Заполняется через JS -->
            </aside>

            <!-- ==== КОНТЕНТ ==== -->
            <main class="guide-content" id="guide-content">
                <!-- Заполняется через JS -->
            </main>
        </div>
    </div>

    <script type="module" src="js/guide/guide-init.js"></script>
</body>

</html>
